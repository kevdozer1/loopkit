[project]
name = "loopkit"
version = "0.1.0"
description = "A small model-agnostic loop for robot task programs: write a program graph, rehearse it in MuJoCo, check it, patch it, trace it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "imageio[ffmpeg]>=2.38.1",
    "matplotlib>=3.11.2",
    "mujoco==3.13.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
